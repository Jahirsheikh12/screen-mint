<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icons/screenmint-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenMint</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Run before any module scripts — set transparent bg for overlay windows
      // to prevent the white flash from Tailwind's bg-background on body.
      (function() {
        var wt = new URLSearchParams(window.location.search).get('windowType') || '';
        if (['hud-overlay','source-selector','countdown','area-overlay','speaker-notes'].indexOf(wt) !== -1) {
          document.documentElement.setAttribute('data-overlay', '');
          document.documentElement.style.background = 'transparent';
          document.body.style.background = 'transparent';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
