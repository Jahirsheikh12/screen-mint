<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icons/screenmint-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenMint</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Run before any module scripts so the first paint matches the target
      // window instead of the browser's default white page background.
      (function() {
        var wt = new URLSearchParams(window.location.search).get('windowType') || '';
        var root = document.getElementById('root');
        if (['hud-overlay','source-selector','countdown','area-overlay','speaker-notes'].indexOf(wt) !== -1) {
          document.documentElement.setAttribute('data-overlay', '');
          document.documentElement.style.background = 'transparent';
          document.body.style.background = 'transparent';
        } else if (wt === 'editor') {
          document.documentElement.style.background = '#0c0c0f';
          document.body.style.background = '#0c0c0f';
          if (root) root.style.background = '#0c0c0f';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
