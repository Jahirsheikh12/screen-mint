<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icons/screenmint-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenMint</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Run before any module scripts so the first paint matches the target
      // window instead of the browser's default white page background.
      (function() {
        var wt = new URLSearchParams(window.location.search).get('windowType') || '';
        var root = document.getElementById('root');
        // Mirrors applyTheme() in src/lib/theme.ts.
        var pref = 'dark';
        try { pref = localStorage.getItem('screenmint.theme') || 'dark'; } catch (e) {}
        var light = pref === 'light' ||
          (pref === 'system' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
        if (['hud-overlay','source-selector','countdown','area-overlay','speaker-notes','update-toast'].indexOf(wt) !== -1) {
          document.documentElement.setAttribute('data-overlay', '');
          document.documentElement.style.background = 'transparent';
          document.body.style.background = 'transparent';
        } else {
          var bg = light ? '#f4f3f0' : '#0e0e10';
          document.documentElement.style.background = bg;
          document.body.style.background = bg;
          if (root) root.style.background = bg;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
