name: Bug Report
description: Report a ScreenMint beta bug.
title: "[Bug]: "
labels: ["bug", "triage", "beta-feedback"]
body:
  - type: checkboxes
    attributes:
      label: Search existing issues
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: e.g., When I click submit, nothing happens...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: e.g., The form should submit and show a success message
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open ScreenMint...
        2. Select display/window/area...
        3. Start recording...
        4. See error...
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Where did the problem happen?
      options:
        - Launch/HUD
        - Source selection
        - Recording
        - Editor
        - Timeline
        - Captions
        - Export
        - Updater
        - Website/download
        - Other
    validations:
      required: true

  - type: dropdown
    id: capture-source
    attributes:
      label: Capture source type
      description: If this is a recording issue, what were you recording?
      options:
        - Not recording related
        - Full display
        - Window
        - Selected area
        - Imported video
        - Other
    validations:
      required: false

  - type: checkboxes
    id: audio-settings
    attributes:
      label: Audio settings
      description: Select any audio sources that were enabled.
      options:
        - label: Microphone
        - label: System audio
        - label: No audio
        - label: Not recording related

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Drag and drop images here or paste them
    validations:
      required: false

  - type: dropdown
    id: os-type
    attributes:
      label: OS
      description: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: ScreenMint version
      description: Version shown in the app or release file name.
      placeholder: e.g., 1.0.3-beta.1
    validations:
      required: false

  - type: input
    id: os-version
    attributes:
      label: OS Version
      description: Please specify your OS version
      placeholder: e.g., Windows 11 23H2, macOS 15.4, Ubuntu 24.04
    validations:
      required: false

  - type: input
    id: os-other
    attributes:
      label: Other OS
      description: If you selected "Other" for OS, please specify your operating system
      placeholder: e.g., FreeBSD, Solaris
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, safe sample files, links, or anything else that helps.
      placeholder: Please do not attach private recordings publicly.
    validations:
      required: false
